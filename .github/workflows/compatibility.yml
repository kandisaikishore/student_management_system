name: Servlet application compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

jobs:
  servlet-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Verify servlet API dependency
        run: test -s src/main/webapp/WEB-INF/lib/javax.servlet-api-3.1.0.jar
      - name: Compile servlet sources against bundled API
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' sources < <(find . -type f -name '*.java' -not -path './.git/*' -not -path './build-classes/*' -print0)
          test "${#sources[@]}" -gt 0
          mkdir -p build-classes
          javac -encoding UTF-8 -cp 'src/main/webapp/WEB-INF/lib/*' -d build-classes "${sources[@]}"
