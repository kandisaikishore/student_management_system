name: Java compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

jobs:
  java-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - name: Locate Java files
        run: |
          set -eu
          find . -type f -name '*.java' -not -path './.git/*' -not -path './build-classes/*' > /tmp/java-sources.txt
          test -s /tmp/java-sources.txt
          cat /tmp/java-sources.txt
      - name: Compile Java source files
        run: |
          set -eu
          mkdir -p build-classes
          javac -encoding UTF-8 -d build-classes @/tmp/java-sources.txt
